<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Steam Ship · deck</title>
  <!-- Bump ?v= when assets change, so browsers don't mix a cached old file with a new page. -->
  <link rel="stylesheet" href="../assets/style.css?v=6">
  <link rel="icon" href="../assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="../assets/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png?v=2">
  <script src="../assets/common.js?v=7"></script>
  <script>requireAboard();</script>
</head>
<body>
  <div class="page">
<pre class="steam">  )  )  )
 (  (  (
 _|_|_|_______
~~\_________/~~~</pre>
    <h1>welcome aboard</h1>
    <div id="announce" class="announce" hidden></div>

    <hr>

    <h2>sign up</h2>
    <p>For <b id="signup-date"></b>. <span id="spots" class="muted"></span></p>
    <p id="full-msg" class="box center" hidden>
      This Wednesday is full.<br>
      <span class="small muted">Check back next week.</span>
    </p>
    <form id="signup" class="box">
      <div class="form-row">
        <label for="name">your name</label>
        <input id="name" type="text" maxlength="60" required>
      </div>
      <div class="form-row">
        <label for="party">party of</label>
        <select id="party"></select>
      </div>
      <div class="form-row">
        <button type="submit" id="signup-btn">count me in</button>
      </div>
      <p id="signup-msg" class="small" style="margin:6px 0 0"></p>
    </form>
    <p id="test-mode" class="notice" hidden>
      test mode: signups are only saved in this browser until SIGNUP_URL is set in
      <code>assets/common.js</code>.
    </p>

    <hr>

    <h2>wind on the water</h2>
    <div id="wind">loading the forecast&hellip;</div>

    <hr>

    <p class="center"><a href="../about/">what to bring &amp; how it works</a></p>
  </div>

  <script>
    const WEDNESDAY = upcomingWednesday();
    const LAT = 47.575580, LON = -122.194396; // Newport Shores, Bellevue WA

    document.getElementById("signup-date").textContent = prettyDate(WEDNESDAY);
    document.getElementById("test-mode").hidden = !testMode();

    // ---- announcement ----
    // Set from /stern; the bar stays hidden when it's blank or can't load.
    function showAnnouncement(text) {
      const bar = document.getElementById("announce");
      bar.textContent = text;
      bar.hidden = !text.trim();
    }

    // ---- sign up ----
    // Party sizes only go up to the seats still open, and the form hides once it's full.
    function showSpotsLeft(left) {
      const form = document.getElementById("signup");
      const select = document.getElementById("party");
      const full = left <= 0;
      form.hidden = full;
      document.getElementById("full-msg").hidden = !full;
      document.getElementById("spots").textContent = full ? ""
        : `${left} ${left === 1 ? "seat" : "seats"} left.`;
      const chosen = Number(select.value) || 1;
      select.innerHTML = "";
      for (let n = 1; n <= Math.max(1, left); n++) select.add(new Option(n, n));
      select.value = String(Math.min(chosen, Math.max(1, left)));
    }

    // The seat count is set from /stern, so it comes along with the announcement.
    async function refreshSpots() {
      try {
        const [list, settings] = await Promise.all([fetchSignups(), fetchSettings()]);
        showAnnouncement(settings.announcement);
        showSpotsLeft(settings.capacity - headcount(list, WEDNESDAY));
      } catch (err) {
        // If the list can't load, leave the form open; the backend still checks capacity.
      }
    }

    showSpotsLeft(DEFAULT_CAPACITY);
    // Don't promise a number until the real count arrives.
    document.getElementById("spots").textContent = "? seats left.";
    refreshSpots();

    document.getElementById("signup").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const party = Number(document.getElementById("party").value);
      const msg = document.getElementById("signup-msg");
      const btn = document.getElementById("signup-btn");
      if (!name) return;

      btn.disabled = true;
      msg.textContent = "sending…";
      try {
        const result = await addSignup({ wednesday: WEDNESDAY, name, party });
        if (result.ok) {
          msg.textContent = `See you on the water, ${name}! (party of ${party})`;
          e.target.reset();
        } else if (result.full) {
          msg.textContent = result.spotsLeft > 0
            ? `Only ${result.spotsLeft} ${result.spotsLeft === 1 ? "seat is" : "seats are"} left now. Try a smaller party?`
            : "";
        } else {
          throw new Error("rejected");
        }
        await refreshSpots();
        // The full message replaces the form, so carry the confirmation over to it.
        if (result.ok && document.getElementById("signup").hidden) {
          document.getElementById("spots").textContent = msg.textContent;
        }
      } catch (err) {
        msg.textContent = "Something went sideways. Try again, or just text us.";
      } finally {
        btn.disabled = false;
      }
    });

    // ---- wind forecast ----
    function windWord(mph) {
      if (mph < 6) return "glassy";
      if (mph < 11) return "light breeze";
      if (mph < 16) return "breezy";
      if (mph < 22) return "choppy";
      return "rough";
    }

    function timeLabel(iso) {
      const h = Number(iso.slice(11, 13));
      return `${h % 12 || 12}${iso.slice(13, 16)} ${h < 12 ? "am" : "pm"}`;
    }

    async function loadWind() {
      const el = document.getElementById("wind");
      const url = "https://api.open-meteo.com/v1/forecast"
        + `?latitude=${LAT}&longitude=${LON}`
        + "&daily=wind_speed_10m_max,wind_gusts_10m_max,sunset"
        + "&wind_speed_unit=mph&timezone=America%2FLos_Angeles"
        + `&start_date=${WEDNESDAY}&end_date=${WEDNESDAY}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const daily = (await res.json()).daily;
        const max = daily.wind_speed_10m_max[0];
        const gust = daily.wind_gusts_10m_max[0];
        el.innerHTML = `
          <p>Looking <b>${windWord(max)}</b>: up to ${Math.round(max)} mph, gusts to ${Math.round(gust)}.
          Sunset is at ${timeLabel(daily.sunset[0])}.</p>`;
      } catch (err) {
        el.textContent = "Couldn't reach the forecast right now. Try refreshing in a bit.";
      }
    }

    loadWind();
  </script>
</body>
</html>
