<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>steamy boat · the stern</title>
  <link rel="stylesheet" href="../assets/style.css?v=5">
  <link rel="icon" href="../assets/favicon.svg?v=1" type="image/svg+xml">
  <link rel="icon" href="../assets/favicon-32.png?v=1" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png?v=1">
  <script src="../assets/common.js?v=5"></script>
  <script>requireAboard();</script>
</head>
<body>
  <div class="page">
    <h1>the stern</h1>
    <p class="tagline">who's coming aboard</p>

    <p id="test-mode" class="notice" hidden>
      test mode: showing signups saved in this browser only. Set SIGNUP_URL in
      <code>assets/common.js</code> to see everyone's.
    </p>

    <h2>announcement</h2>
    <form id="announce-form" class="box">
      <label for="announce-text" class="small muted">Shown in a bar at the top of the deck. Leave blank to hide it.</label>
      <textarea id="announce-text" rows="2" maxlength="500" placeholder="loading&hellip;" disabled></textarea>
      <div class="form-row">
        <button type="submit" id="announce-save">save</button>
        <button type="button" id="announce-clear">clear</button>
        <span id="announce-msg" class="small muted"></span>
      </div>
    </form>

    <hr>

    <div id="list">loading the manifest&hellip;</div>

    <p class="center"><button id="refresh">refresh</button></p>

    <div class="footer"><a href="../deck/">back to the deck</a></div>
  </div>

  <script>
    document.getElementById("test-mode").hidden = !testMode();

    // ---- announcement ----
    const announceText = document.getElementById("announce-text");
    const announceMsg = document.getElementById("announce-msg");

    async function loadAnnouncement() {
      try {
        announceText.value = await fetchAnnouncement();
        announceText.placeholder = "nothing posted";
        announceText.disabled = false;
      } catch (err) {
        announceText.placeholder = "";
        announceMsg.textContent = "Couldn't load the announcement.";
      }
    }

    async function saveAnnouncement(text) {
      announceMsg.textContent = "saving…";
      try {
        await setAnnouncement(text);
        announceText.value = text.trim();
        announceMsg.textContent = text.trim() ? "Posted." : "Cleared. The bar is hidden.";
      } catch (err) {
        announceMsg.textContent = "Couldn't save. Try again.";
      }
    }

    document.getElementById("announce-form").addEventListener("submit", (e) => {
      e.preventDefault();
      saveAnnouncement(announceText.value);
    });
    document.getElementById("announce-clear").addEventListener("click", () => saveAnnouncement(""));

    loadAnnouncement();

    function timeLabel(iso) {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
      });
    }

    // Past trips older than this drop off the page (they stay in the Sheet).
    const PAST_DAYS_SHOWN = 28;

    let signups = [];
    let showAllPast = false;

    function section(date, people, isPast) {
      const total = people.reduce((n, p) => n + Number(p.party || 0), 0);
      const rows = people.map((p) => `<tr>
          <td>${escapeHtml(p.name)}</td>
          <td class="num">${Number(p.party) || ""}</td>
          <td class="small muted">${timeLabel(p.timestamp)}</td>
          <td><button class="small" data-i="${signups.indexOf(p)}">remove</button></td>
        </tr>`).join("");
      const full = !isPast && total >= CAPACITY ? " &middot; <b>full</b>" : "";
      return `<h2>${prettyDate(date)}</h2>
        <p${isPast ? ' class="muted"' : ""}><b>${total}</b> of ${CAPACITY} aboard
          across ${people.length} ${people.length === 1 ? "signup" : "signups"}${isPast ? " (past)" : full}</p>
        <table>
          <tr><th>name</th><th class="num">party</th><th>signed up</th><th></th></tr>
          ${rows}
        </table>`;
    }

    document.getElementById("list").addEventListener("click", async (e) => {
      if (e.target.id === "show-older") {
        e.preventDefault();
        showAllPast = true;
        load();
        return;
      }
      const btn = e.target.closest("button[data-i]");
      if (!btn) return;
      const s = signups[Number(btn.dataset.i)];
      if (!confirm(`Remove ${s.name} (party of ${s.party}) from ${prettyDate(s.wednesday)}?`)) return;
      btn.disabled = true;
      btn.textContent = "removing…";
      try {
        await deleteSignup(s);
        load();
      } catch (err) {
        alert("Couldn't remove that one. Refresh and try again.");
        btn.disabled = false;
        btn.textContent = "remove";
      }
    });

    async function load() {
      const el = document.getElementById("list");
      el.textContent = "loading the manifest…";
      try {
        signups = await fetchSignups();
        if (!signups.length) {
          el.innerHTML = "<p class='center muted'>Nobody yet. The sauna is lonely.</p>";
          return;
        }

        const byDate = {};
        for (const s of signups) (byDate[s.wednesday] ||= []).push(s);

        const today = isoDate(new Date());
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - PAST_DAYS_SHOWN);
        const upcoming = Object.keys(byDate).filter((d) => d >= today).sort();
        const past = Object.keys(byDate).filter((d) => d < today).sort().reverse();
        // Older trips stay in the Sheet; they're just tucked away here.
        const recent = showAllPast ? past : past.filter((d) => d >= isoDate(cutoff));
        const hidden = past.length - recent.length;

        el.innerHTML = (upcoming.length
            ? upcoming.map((d) => section(d, byDate[d], false)).join("")
            : "<p class='center muted'>No upcoming signups yet.</p>")
          + (recent.length ? "<hr>" + recent.map((d) => section(d, byDate[d], true)).join("") : "")
          + (hidden ? `<p class="center small muted">${hidden} older ${hidden === 1 ? "trip" : "trips"} hidden.
              <a href="#" id="show-older">show</a></p>` : "");
      } catch (err) {
        el.textContent = "Couldn't load signups. Check SIGNUP_URL, or try again.";
      }
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
