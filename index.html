<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Steam Ship</title>
  <link rel="stylesheet" href="assets/style.css?v=5">
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
</head>
<body>
  <div class="page gate">
<pre class="steam">  )  )  )
 (  (  (
  )  )  )
 _|_|_|_______
 \  ~ ~ ~ ~  /
~~\_________/~~~</pre>
    <h1>Steam Ship</h1>
    <p class="tagline">a floating sauna on lake washington</p>

    <form id="gate">
      <label for="pw" class="small muted">what's the password?</label><br>
      <input id="pw" type="password" autocomplete="off" autofocus>
      <button type="submit">board</button>
    </form>
    <p class="whisper" id="whisper"></p>
  </div>

  <script src="assets/common.js?v=5"></script>
  <script>
    if (isAboard()) location.replace("deck/");

    const whispers = [
      "the water's cold out here. try again.",
      "hmm, not quite.",
      "ask whoever sent you the link.",
    ];
    let misses = 0;

    document.getElementById("gate").addEventListener("submit", (e) => {
      e.preventDefault();
      const pw = document.getElementById("pw");
      if (pw.value.trim().toLowerCase() === "sauna") {
        setAboard();
        location.href = "deck/";
      } else {
        document.getElementById("whisper").textContent = whispers[misses++ % whispers.length];
        pw.value = "";
        pw.focus();
      }
    });
  </script>
</body>
</html>
